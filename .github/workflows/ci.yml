name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Build order matters: core → node → {fastify, hono, next}.
      # file: deps resolve to ../<pkg>, so each package must be built
      # before its dependents run tests.
      matrix:
        package: [core, node, fastify, hono, next]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: typescript/${{ matrix.package }}
        run: npm ci || npm install

      - name: Build dependencies first
        if: matrix.package != 'core'
        run: |
          for dep in core node; do
            if [ -d "typescript/$dep" ] && [ "typescript/$dep" != "typescript/${{ matrix.package }}" ]; then
              (cd "typescript/$dep" && npm ci || npm install) && (cd "typescript/$dep" && npm run build)
            fi
          done

      - name: Build
        working-directory: typescript/${{ matrix.package }}
        run: npm run build

      - name: Test
        working-directory: typescript/${{ matrix.package }}
        run: npm test

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package + dev deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[asgi,wsgi,dev,docs]"
          pip install ruff

      - name: Test
        working-directory: python
        run: python -m pytest tests/ -q

      - name: Lint
        working-directory: python
        run: ruff check src tests

      - name: Conformance
        working-directory: python
        run: python tests/conformance_runner.py

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        run: go build ./...

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test
        working-directory: go
        run: go test ./...

      - name: Conformance
        working-directory: go
        run: go run ./cmd/conformance

  docs-freshness:
    name: Generated docs freshness
    runs-on: ubuntu-latest
    needs: [typescript, python, go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install TypeScript deps (all packages)
        run: |
          for pkg in core node fastify hono next; do
            (cd "typescript/$pkg" && npm ci || npm install && npm run build)
          done

      - name: Install Python deps
        working-directory: python
        run: |
          pip install -e ".[asgi,wsgi,dev,docs]"

      - name: Consumer-driven contract check (doc snippets vs real API)
        run: python scripts/cdct.py

      - name: Check generated docs are fresh
        run: python scripts/check_docs.py
