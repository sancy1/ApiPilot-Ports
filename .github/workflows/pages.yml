name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "typescript/**/src/**"
      - "typescript/**/typedoc.json"
      - "python/src/**"
      - "python/apidocs/**"
      - "go/**/*.go"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install TypeScript deps + build
        run: |
          for pkg in core node fastify hono next; do
            (cd "typescript/$pkg" && npm ci && npm run build)
          done

      - name: Build TypeScript API docs (TypeDoc)
        run: |
          for pkg in core node fastify hono next; do
            (cd "typescript/$pkg" && npx typedoc --out "../../site/typescript/$pkg")
          done

      - name: Install Python deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[asgi,dev,docs]"

      - name: Build Python API docs (Sphinx)
        working-directory: python
        run: sphinx-build -q -b html apidocs ../site/python

      - name: Build Go API docs
        working-directory: go
        run: go run ./cmd/apidoc -out ../site/go

      - name: Assemble site index
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>ApiPilot-Ports — Documentation</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 52rem;
                     margin: 4rem auto; padding: 0 1rem; line-height: 1.6; }
              h1 { border-bottom: 2px solid #333; padding-bottom: .3rem; }
              li { margin: .4rem 0; }
              code { background: #f4f4f4; padding: .1rem .3rem; border-radius: 3px; }
            </style>
          </head>
          <body>
            <h1>ApiPilot-Ports</h1>
            <p>Language ports of the ApiPilot API middleware:
               TypeScript, Python, and Go.</p>
            <h2>API reference</h2>
            <h3>TypeScript</h3>
            <ul>
              <li><a href="typescript/core/">@apipilot/core</a></li>
              <li><a href="typescript/node/">@apipilot/node</a></li>
              <li><a href="typescript/fastify/">@apipilot/fastify</a></li>
              <li><a href="typescript/hono/">@apipilot/hono</a></li>
              <li><a href="typescript/next/">@apipilot/next</a></li>
            </ul>
            <h3>Python</h3>
            <ul>
              <li><a href="python/">apipilot (Sphinx)</a></li>
            </ul>
            <h3>Go</h3>
            <ul>
              <li><a href="go/core.md">core</a> · <a href="go/httpapi.md">httpapi</a> (markdown)</li>
            </ul>
            <h2>Specs</h2>
            <ul>
              <li><a href="https://github.com/sancy1/ApiPilot-Ports/blob/main/conformance/consumer/README.md">Consumer-driven contract</a></li>
            </ul>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# trigger: pages redeploy
