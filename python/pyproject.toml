[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apipilot"
version = "0.1.2"
description = "ApiPilot for Python — framework-neutral core plus ASGI adapter. Envelopes, error codes, pagination, validation keys, origin, fetch-metadata, cookie rules, CSRF."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/sancy1/ApiPilot-Ports"
Documentation = "https://sancy1.github.io/ApiPilot-Ports/python/"
Repository = "https://github.com/sancy1/ApiPilot-Ports"

[project.optional-dependencies]
asgi = ["fastapi>=0.110", "starlette>=0.37", "cryptography>=42"]
wsgi = ["cryptography>=42"]
dev = ["pytest>=8.0", "httpx>=0.27"]
docs = ["sphinx>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
